{% extends "base.html" %}{% block content %}<h1>{{project.reference_number}} — {{project.title}}</h1><p>{{project.short_description}}</p><div class="card"><form method="post"><label>Phase</label><select name="phase">{% for x in phases %}<option {% if x==project.phase %}selected{% endif %}>{{x}}</option>{% endfor %}</select><label>Status</label><select name="status">{% for x in statuses %}<option {% if x==project.status %}selected{% endif %}>{{x}}</option>{% endfor %}</select><label>Assigned team</label><input name="assigned_team" value="{{project.assigned_team or ''}}"><label>PMO analyst</label><select name="pmo_analyst_id"><option value="">—</option>{% for r in resources %}<option value="{{r.id}}" {% if project.pmo_analyst_id==r.id %}selected{% endif %}>{{r.name}}</option>{% endfor %}</select><label>Group lead</label><select name="group_lead_id"><option value="">—</option>{% for r in resources %}<option value="{{r.id}}" {% if project.group_lead_id==r.id %}selected{% endif %}>{{r.name}}</option>{% endfor %}</select><label>Project lead</label><select name="project_lead_id"><option value="">—</option>{% for r in resources %}<option value="{{r.id}}" {% if project.project_lead_id==r.id %}selected{% endif %}>{{r.name}}</option>{% endfor %}</select><label>IT Demand #</label><input name="it_demand_number" value="{{project.it_demand_number or ''}}"><label>Estimated cost</label><input name="estimated_cost" type="number" step=".01" value="{{project.estimated_cost or ''}}"><label>Duration (weeks)</label><input name="estimated_duration_weeks" type="number" value="{{project.estimated_duration_weeks or ''}}"><label>Document links</label><textarea name="document_links">{{project.document_links or ''}}</textarea><label>Decision/rejection reason</label><textarea name="decision_reason">{{project.decision_reason or ''}}</textarea><label>Update note</label><textarea name="note"></textarea><button>Save update</button></form></div><div class="card"><h2>Status history</h2>{% for h in histories %}<p><strong>{{h.created_at.strftime('%Y-%m-%d')}}</strong> · {{h.phase}} / {{h.status}} — {{h.note or 'No note'}}</p>{% endfor %}</div>{% endblock %}
