{% extends "base.html" %}{% block content %}<h1>Submit IT project request</h1><form method="post"><label>Requester name</label><input name="requester_name" required><label>Requester email</label><input name="requester_email" type="email" required><label>Organization number</label><input name="organization_number" required><label>Organization title</label><input name="organization_title" required><label>Project title</label><input name="title" required><label>Short description</label><textarea name="short_description" required></textarea><label>Category</label><select name="category">{% for x in categories %}<option>{{x.label}}</option>{% endfor %}</select><label>Project type</label><select name="project_type">{% for x in types %}<option>{{x.label}}</option>{% endfor %}</select><label>Construction agency</label><select name="construction_agency">{% for x in agencies %}<option>{{x.label}}</option>{% endfor %}</select><label>Impacted systems</label><select name="impacted_systems" multiple>{% for x in systems %}<option>{{x.label}}</option>{% endfor %}</select><button>Submit request</button></form>{% endblock %}
